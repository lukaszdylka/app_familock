name: One-off voucher logic hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-voucher-logic-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch voucher accounting and session lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('files/app.js')
          app = app_path.read_text(encoding='utf-8')

          if 'FAMILOCK_VOUCHER_LOGIC_V2' not in app:
              old = "const liveSessions = () => S.sessions.filter(x => !x.test);\nconst totalRevenue = () => liveSessions().reduce((s, x) => s + (Number(x.revenue) || 0), 0);\n\nconst totalBalance = () => totalRevenue() - totalCosts();"
              new = "const liveSessions = () => S.sessions.filter(x => !x.test);\nconst sessionRevenueTotal = () => liveSessions().reduce((s, x) => s + (Number(x.revenue) || 0), 0);\nconst voucherRevenueTotal = () => (S.vouchers || []).reduce((s, v) => s + (Number(v.value) || 0), 0);\nconst voucherRevenueForMonth = ym => (S.vouchers || []).reduce((s, v) =>\n  s + (String(v.saleDate || '').startsWith(ym) ? (Number(v.value) || 0) : 0), 0);\nconst totalRevenue = () => sessionRevenueTotal() + voucherRevenueTotal();\n\nconst totalBalance = () => totalRevenue() - totalCosts();"
              if old not in app:
                  raise SystemExit('Accounting anchor not found')
              app = app.replace(old, new, 1)

              avg_old = "const avgRev = cnt > 0 ? rev / cnt : 0;"
              if avg_old not in app:
                  raise SystemExit('Average revenue anchor not found')
              app = app.replace(avg_old, "const avgRev = cnt > 0 ? sessionRevenueTotal() / cnt : 0;", 1)

              month_old = "const thisMonthRev = thisMonth.reduce((s, x) => s + (Number(x.revenue) || 0), 0);"
              if month_old not in app:
                  raise SystemExit('Month revenue anchor not found')
              app = app.replace(month_old, "const thisMonthRev = thisMonth.reduce((s, x) => s + (Number(x.revenue) || 0), 0) + voucherRevenueForMonth(ym);", 1)

              chart_old = "  S.sessions.forEach(s => {\n    if (!s.date) return;\n    const ym = s.date.substring(0, 7);\n    byMonth[ym] = (byMonth[ym] || 0) + (Number(s.revenue) || 0);\n  });"
              chart_new = "  liveSessions().forEach(s => {\n    if (!s.date) return;\n    const ym = s.date.substring(0, 7);\n    byMonth[ym] = (byMonth[ym] || 0) + (Number(s.revenue) || 0);\n  });\n  (S.vouchers || []).forEach(v => {\n    if (!v.saleDate) return;\n    const ym = String(v.saleDate).substring(0, 7);\n    byMonth[ym] = (byMonth[ym] || 0) + (Number(v.value) || 0);\n  });"
              if chart_old not in app:
                  raise SystemExit('Monthly chart anchor not found')
              app = app.replace(chart_old, chart_new, 1)

              patch = Path('files/voucher-logic-v2.inc.js').read_text(encoding='utf-8')
              app = app.rstrip() + '\n\n' + patch.rstrip() + '\n'
              app_path.write_text(app, encoding='utf-8')

          sync_path = Path('files/sync.js')
          sync = sync_path.read_text(encoding='utf-8')
          anchor = "        if (!cloudData.debts)  cloudData.debts = [];"
          if "if (!cloudData.vouchers)" not in sync:
              if anchor not in sync:
                  raise SystemExit('Sync voucher migration anchor not found')
              sync = sync.replace(anchor, anchor + "\n        if (!cloudData.vouchers) cloudData.vouchers = [];", 1)
              sync_path.write_text(sync, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check files/app.js && node --check files/sync.js
      - name: Commit production fix
        run: |
          git config user.name "Familock CI"
          git config user.email "actions@users.noreply.github.com"
          git add files/app.js files/sync.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix: harden voucher accounting and session lifecycle"
            git push origin main
          fi
